<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóa Đại Cương - Học Tập & Trắc Nghiệm Toàn Diện</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #0d9488;
      --accent-light: #f0fdfa;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.07);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius: 12px;
      --font-stack: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-dark: #60a5fa;
      --primary-light: #1e293b;
      --accent: #14b8a6;
      --accent-light: #134e4a;
      --success: #22c55e;
      --success-bg: #14532d;
      --danger: #ef4444;
      --danger-bg: #7f1d1d;
      --warning: #f59e0b;
      --warning-bg: #78350f;
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
    }

    /* HEADER */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .theme-toggle-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    /* NAVIGATION TABS */
    .nav-tabs-wrapper {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .nav-tabs {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      padding: 8px 16px;
      gap: 6px;
    }

    .nav-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .nav-tab-btn:hover {
      color: var(--text-main);
      background: var(--bg-subtle);
    }

    .nav-tab-btn.active {
      color: var(--primary);
      background: var(--primary-light);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* MAIN CONTAINER */
    main {
      max-width: 1240px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* CHAPTER BANNER */
    .chapter-banner {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chapter-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .chapter-heading {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .chapter-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* PROGRESS BAR */
    .progress-box {
      background: var(--bg-subtle);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* SUB TABS (LÝ THUYẾT / TRẮC NGHIỆM) */
    .sub-tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
      width: fit-content;
      margin-bottom: 20px;
    }

    .sub-tab-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sub-tab-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* SECTION CONTENT */
    .section-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .section-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* THEORY CARDS */
    .theory-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .theory-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theory-card h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: var(--text-main);
    }

    .theory-card p {
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .theory-card ul, .theory-card ol {
      margin: 8px 0 16px 24px;
    }

    .theory-card li {
      margin-bottom: 6px;
    }

    /* CALLOUT BOXES */
    .callout {
      border-left: 4px solid var(--primary);
      background: var(--primary-light);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      font-size: 0.92rem;
    }

    .callout.accent {
      border-left-color: var(--accent);
      background: var(--accent-light);
    }

    .callout.warning {
      border-left-color: var(--warning);
      background: var(--warning-bg);
    }

    .callout-title {
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    /* FORMULA DISPLAY */
    .formula-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      margin: 12px 0;
      font-family: 'Cambria Math', 'KaTeX_Main', serif;
      font-size: 1.15rem;
      text-align: center;
      color: var(--text-main);
      overflow-x: auto;
    }

    /* TABLES */
    .table-responsive {
      overflow-x: auto;
      margin: 16px 0;
    }

    table.content-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    table.content-table th, table.content-table td {
      padding: 10px 14px;
      border: 1px solid var(--border);
    }

    table.content-table th {
      background: var(--bg-subtle);
      font-weight: 700;
    }

    table.content-table tr:nth-child(even) {
      background: rgba(0, 0, 0, 0.015);
    }

    /* QUIZ SECTION */
    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-question-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .question-number {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .question-difficulty {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .diff-easy { background: var(--success-bg); color: var(--success); }
    .diff-med { background: var(--warning-bg); color: var(--warning); }
    .diff-hard { background: var(--danger-bg); color: var(--danger); }

    .question-stem {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--bg-subtle);
      transform: translateX(3px);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.selected-correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      animation: pulseGreen 0.4s ease;
    }

    .option-btn.selected-wrong {
      background: var(--danger-bg) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      animation: shake 0.4s ease;
    }

    .option-btn.show-correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* EXPLANATION BOX */
    .explanation-box {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border-left: 4px solid var(--accent);
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .explanation-title {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* CHAPTER RESULT SCORECARD */
    .quiz-result-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      margin-top: 24px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
    }

    .score-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-sub {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .result-stats-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--bg-subtle);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .stat-chip strong {
      font-size: 1.1rem;
    }

    .result-feedback {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* SUMMARY DASHBOARD */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .summary-card-val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 6px 0;
    }

    .chapter-breakdown-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chapter-breakdown-table th, .chapter-breakdown-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .chapter-breakdown-table th {
      background: var(--bg-subtle);
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 48px;
    }

    @media (max-width: 640px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .chapter-title-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">⚗️</div>
        <div>
          <div class="brand-title">HÓA ĐẠI CƯƠNG</div>
          <div class="brand-subtitle">Hệ Thống Toàn Bộ 8 Chương Lý Thuyết & 80 Câu Hỏi Trắc Nghiệm Chuẩn</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
          <span id="themeIcon">🌙</span> <span id="themeLabel">Chế độ tối</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs-wrapper">
    <div class="nav-tabs" id="chapterNav">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- MAIN VIEWPORT -->
  <main id="appMain">
    <!-- Chapter View container populated by JS -->
  </main>

  <footer>
    <p><strong>Học phần Hóa Học Đại Cương</strong> • Biên soạn theo chuẩn chương trình Đại học</p>
    <p style="margin-top: 4px;">Dữ liệu chuẩn xác theo Giáo trình PGS.TS. Nguyễn Đình Soa & Đề cương môn học</p>
  </footer>

  <script>
    // --- 1. DỮ LIỆU ĐẦY ĐỦ 8 CHƯƠNG ---
    const chaptersData = [
      {
        id: 1,
        title: "Cấu tạo nguyên tử & Bảng tuần hoàn",
        shortTitle: "Chương 1: Cấu tạo nguyên tử",
        badge: "Chương 1",
        description: "Các định luật cơ bản, định luật chất khí, thuyết lượng tử, 4 số lượng tử và cấu hình electron nguyên tử.",
        theoryHtml: `
          <div class="theory-card">
            <h3>1. Các khái niệm và định luật cơ bản của Hóa học</h3>
            <p><strong>Nguyên tử:</strong> Tiểu phân nhỏ nhất của một nguyên tố hóa học, không thể phân chia nhỏ hơn về mặt hóa học và không thay đổi trong các phản ứng hóa học thông thường.</p>
            <p><strong>Phân tử:</strong> Tiểu phân nhỏ nhất của một chất có khả năng tồn tại độc lập và vẫn bảo toàn nguyên vẹn tính chất hóa học của chất đó.</p>
            <p><strong>Mol:</strong> Lượng chất chứa đúng <code>6,022 &times; 10<sup>23</sup></code> tiểu phân cấu trúc (nguyên tử, phân tử, ion) của chất đó (hằng số Avogadro <em>N<sub>0</sub></em>).</p>
            
            <div class="callout">
              <div class="callout-title">📌 Định luật bảo toàn khối lượng (Lomonosov - Lavoisier):</div>
              Tổng khối lượng của các chất tham gia phản ứng luôn bằng tổng khối lượng của các sản phẩm tạo thành trong một hệ kín.
            </div>

            <div class="callout accent">
              <div class="callout-title">📌 Định luật thành phần không đổi (Proust):</div>
              Một hợp chất hóa học xác định dù được điều chế bằng bất kỳ phương pháp nào hoặc lấy từ bất kỳ nguồn gốc nào cũng luôn luôn có thành phần khối lượng các nguyên tố không đổi.
            </div>

            <div class="callout">
              <div class="callout-title">📌 Định luật tỷ lệ bội (Dalton):</div>
              Nếu hai nguyên tố hóa hợp với nhau tạo thành nhiều hợp chất khác nhau thì những lượng khối lượng của một nguyên tố kết hợp với cùng một lượng khối lượng của nguyên tố kia sẽ tỷ lệ với nhau như những số nguyên đơn giản.
            </div>

    // --- 2. TRẠNG THÁI ỨNG DỤNG (JS MEMORY - KHÔNG DÙNG LOCALSTORAGE) ---
    const appState = {
      theme: 'light',
      currentTab: 1, // 1 -> 8: chapters, 9: tổng kết
      chapterSubTab: { 1:'theory', 2:'theory', 3:'theory', 4:'theory', 5:'theory', 6:'theory', 7:'theory', 8:'theory' },
      quizSession: {} // Lưu trữ câu hỏi đã xáo trộn, câu trả lời, v.v.
    };

    // Khởi tạo phiên làm bài cho từng chương
    function initQuizSessions() {
      chaptersData.forEach(ch => {
        setupChapterQuiz(ch.id);
      });
    }

    function setupChapterQuiz(chId) {
      const ch = chaptersData.find(c => c.id === chId);
      // Xáo trộn câu hỏi và các lựa chọn đáp án
      const shuffledQuestions = ch.questions.map((q, idx) => {
        const originalOptions = q.options.map((optText, optIdx) => ({
          text: optText,
          isCorrect: optIdx === q.correct
        }));
        // Xáo trộn lựa chọn
        const shuffledOpts = [...originalOptions].sort(() => Math.random() - 0.5);
        return {
          id: idx + 1,
          stem: q.stem,
          diff: q.diff,
          explanation: q.explanation,
          options: shuffledOpts,
          selectedIdx: null, // chỉ số lựa chọn đã bấm
          isAnswered: false
        };
      }).sort(() => Math.random() - 0.5);

      appState.quizSession[chId] = {
        questions: shuffledQuestions,
        answeredCount: 0,
        correctCount: 0,
        completed: false
      };
    }

    // --- 3. GIAO DIỆN & TƯƠNG TÁC ---
    function renderNavigation() {
      const nav = document.getElementById('chapterNav');
      let html = '';
      chaptersData.forEach(ch => {
        html += `
          <button class="nav-tab-btn ${appState.currentTab === ch.id ? 'active' : ''}" onclick="switchTab(${ch.id})">
            <span>📖</span> ${ch.shortTitle}
          </button>
        `;
      });
      // Tab tổng kết
      html += `
        <button class="nav-tab-btn ${appState.currentTab === 9 ? 'active' : ''}" onclick="switchTab(9)">
          <span>🏆</span> Tổng kết toàn khóa
        </button>
      `;
      nav.innerHTML = html;
    }

    function switchTab(tabId) {
      appState.currentTab = tabId;
      renderNavigation();
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSubTab(chId, subTab) {
      appState.chapterSubTab[chId] = subTab;
      const theorySec = document.getElementById(`theory-sec-${chId}`);
      const quizSec = document.getElementById(`quiz-sec-${chId}`);
      const btnTheory = document.getElementById(`btn-subtab-theory-${chId}`);
      const btnQuiz = document.getElementById(`btn-subtab-quiz-${chId}`);

      if (subTab === 'theory') {
        theorySec.classList.add('active');
        quizSec.classList.remove('active');
        btnTheory.classList.add('active');
        btnQuiz.classList.remove('active');
      } else {
        theorySec.classList.remove('active');
        quizSec.classList.add('active');
        btnTheory.classList.remove('active');
        btnQuiz.classList.add('active');
      }
    }

    function renderMainContent() {
      const container = document.getElementById('appMain');
      if (appState.currentTab === 9) {
        renderSummaryDashboard(container);
        return;
      }

      const ch = chaptersData.find(c => c.id === appState.currentTab);
      const session = appState.quizSession[ch.id];
      const progressPercent = Math.round((session.answeredCount / session.questions.length) * 100);

      let html = `
        <div class="chapter-banner">

    function renderQuizCardsHtml(chId) {
      const session = appState.quizSession[chId];
      const letters = ['A', 'B', 'C', 'D'];
      let html = '';

      session.questions.forEach((q, qIndex) => {
        let diffBadge = '';
        if (q.diff === 'easy') diffBadge = '<span class="question-difficulty diff-easy">Cơ bản</span>';
        else if (q.diff === 'med') diffBadge = '<span class="question-difficulty diff-med">Trung bình</span>';
        else diffBadge = '<span class="question-difficulty diff-hard">Vận dụng</span>';

        html += `
          <div class="quiz-question-card" id="qcard-${chId}-${qIndex}">
            <div class="question-header">
              <span class="question-number">Câu ${qIndex + 1} / ${session.questions.length}</span>
              ${diffBadge}
            </div>
            <div class="question-stem">${q.stem}</div>
            <div class="options-grid">
        `;

        q.options.forEach((opt, optIndex) => {
          let btnClass = 'option-btn';
          let disabled = q.isAnswered ? 'disabled' : '';

          if (q.isAnswered) {
            if (optIndex === q.selectedIdx) {
              btnClass += opt.isCorrect ? ' selected-correct' : ' selected-wrong';
            } else if (opt.isCorrect) {
              btnClass += ' show-correct';
            }
          }

          html += `
            <button class="${btnClass}" ${disabled} onclick="handleAnswer(${chId}, ${qIndex}, ${optIndex})">
              <div class="option-letter">${letters[optIndex]}</div>
              <div class="option-text">${opt.text}</div>
            </button>
          `;
        });

        html += `
            </div>
            <div class="explanation-box" id="explain-${chId}-${qIndex}" style="${q.isAnswered ? 'display: block;' : 'display: none;'}">
              <div class="explanation-title">
                <span>💡</span> Giải thích chi tiết & Căn cứ khoa học:
              </div>
              <p>${q.explanation}</p>
            </div>
          </div>
        `;
      });

      return html;
    }

    function handleAnswer(chId, qIndex, optIndex) {
      const session = appState.quizSession[chId];
      const question = session.questions[qIndex];
      if (question.isAnswered) return;

      question.isAnswered = true;
      question.selectedIdx = optIndex;
      session.answeredCount++;

      const isCorrect = question.options[optIndex].isCorrect;
      if (isCorrect) session.correctCount++;

      // Cập nhật câu hỏi hiện tại trên DOM
      const card = document.getElementById(`qcard-${chId}-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === optIndex) {
          btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
        } else if (question.options[idx].isCorrect) {
          btn.classList.add('show-correct');
        }
      });

      // Hiển thị khung giải thích
      const explainBox = document.getElementById(`explain-${chId}-${qIndex}`);
      explainBox.style.display = 'block';

      // Cập nhật thanh tiến độ banner
      const progressPercent = Math.round((session.answeredCount / session.questions.length) * 100);
      const bannerFill = document.querySelector('.progress-fill');
      const bannerLabels = document.querySelector('.progress-labels span:last-child');
      if (bannerFill) bannerFill.style.width = progressPercent + '%';
      if (bannerLabels) bannerLabels.textContent = `${session.answeredCount} / ${session.questions.length} câu (${progressPercent}%)`;

      // Kiểm tra hoàn thành chương
      if (session.answeredCount === session.questions.length) {
        session.completed = true;
        showResultCard(chId);
      }
    }

    function showResultCard(chId) {
      const resultCard = document.getElementById(`quizResultCard-${chId}`);
      if (!resultCard) return;
      resultCard.innerHTML = renderResultScorecardHtml(chId);
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    function renderResultScorecardHtml(chId) {
      const session = appState.quizSession[chId];
      const total = session.questions.length;
      const score10 = (session.correctCount / total) * 10;
      const scorePercent = Math.round((session.correctCount / total) * 100);

      let feedback = '';
      if (score10 >= 9) feedback = '🌟 Xuất sắc! Bạn nắm rất vững bản chất hóa học và giải quyết bài toán cực tốt!';
      else if (score10 >= 7) feedback = '👏 Khá tốt! Bạn đã nắm được phần lớn lý thuyết cốt lõi, hãy xem lại các câu giải thích sai.';
      else if (score10 >= 5) feedback = '📖 Trung bình. Cần đọc lại kỹ các công thức và điều kiện trong phần lý thuyết.';
      else feedback = '⚠️ Chưa đạt yêu cầu. Bạn nên xem kỹ lại phần lý thuyết và bấm "Làm lại" để củng cố!';

      return `
        <div class="score-circle">
          <div class="score-value">${score10.toFixed(1)}</div>
          <div class="score-sub">${scorePercent}%</div>
        </div>
        <h2>Kết Quả Ôn Luyện Chương ${chId}</h2>
        <div class="result-stats-row">
          <div class="stat-chip">Tổng số câu: <strong>${total}</strong></div>
          <div class="stat-chip" style="color: var(--success);">Số câu đúng: <strong>${session.correctCount}</strong></div>
          <div class="stat-chip" style="color: var(--danger);">Số câu sai: <strong>${total - session.correctCount}</strong></div>
        </div>
        <p class="result-feedback">${feedback}</p>
        <div class="result-actions">
          <button class="btn-primary" onclick="restartChapterQuiz(${chId})">
            🔄 Làm lại chương này (Xáo trộn đề mới)
          </button>
          <button class="btn-secondary" onclick="switchTab(9)">
            📊 Xem bảng điểm tổng kết toàn khóa
          </button>
        </div>
      `;
    }

    function restartChapterQuiz(chId) {
      setupChapterQuiz(chId);
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 4. TRANG TỔNG KẾT TOÀN BỘ 8 CHƯƠNG ---
    function renderSummaryDashboard(container) {
      let totalQuestions = 0;
      let totalAnswered = 0;
      let totalCorrect = 0;

      chaptersData.forEach(ch => {
        const s = appState.quizSession[ch.id];
        totalQuestions += s.questions.length;
        totalAnswered += s.answeredCount;
        totalCorrect += s.correctCount;
      });

      const overallPercent = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
      const overallScore10 = totalQuestions > 0 ? ((totalCorrect / totalQuestions) * 10).toFixed(2) : 0;

      let rowsHtml = '';
      chaptersData.forEach(ch => {
        const s = appState.quizSession[ch.id];
        const chPercent = Math.round((s.correctCount / s.questions.length) * 100);
        const chScore = ((s.correctCount / s.questions.length) * 10).toFixed(1);
        const statusBadge = s.completed 
          ? `<span style="color: var(--success); font-weight: 700;">Đã hoàn thành</span>`
          : (s.answeredCount > 0 ? `<span style="color: var(--warning); font-weight: 600;">Đang làm (${s.answeredCount}/10)</span>` : `<span style="color: var(--text-muted);">Chưa làm</span>`);

        rowsHtml += `
          <tr>
            <td><strong>${ch.badge}</strong>: ${ch.title}</td>
            <td>${s.answeredCount} / ${s.questions.length}</td>
            <td><strong style="color: ${s.correctCount > 6 ? 'var(--success)' : 'inherit'}">${s.correctCount}</strong> / ${s.questions.length}</td>
            <td><strong>${chScore}</strong> (${chPercent}%)</td>
            <td>${statusBadge}</td>
            <td>
              <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="switchTab(${ch.id}); switchSubTab(${ch.id}, 'quiz');">
                ${s.completed ? 'Xem lại' : 'Vào luyện'}
              </button>
            </td>
          </tr>
        `;
      });

      let html = `
        <div class="chapter-banner">
          <span class="chapter-badge">Bảng Thống Kê Điểm Số</span>
          <h1 class="chapter-heading">Tổng Kết Quá Trình Học Tập & Luyện Tập 8 Chương</h1>
          <p class="chapter-meta">Theo dõi tiến độ, số câu đúng và điểm số trung bình của toàn bộ 80 câu trắc nghiệm Hóa Đại Cương.</p>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">ĐIỂM TRUNG BÌNH TOÀN KHÓA</span>
            <div class="summary-card-val">${overallScore10} <span style="font-size: 1.1rem; color: var(--text-muted);">/ 10</span></div>
            <div style="font-size: 0.85rem; color: var(--accent); font-weight: 600;">Tương đương ${overallPercent}% chính xác</div>
          </div>
          <div class="summary-card">
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">TỔNG CÂU ĐÃ HOÀN THÀNH</span>
            <div class="summary-card-val">${totalAnswered} <span style="font-size: 1.1rem; color: var(--text-muted);">/ ${totalQuestions}</span></div>
            <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600;">Tiến độ đạt ${Math.round((totalAnswered / totalQuestions) * 100)}%</div>
          </div>
          <div class="summary-card">
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">SỐ CÂU ĐÚNG TỔNG CỘNG</span>
            <div class="summary-card-val" style="color: var(--success);">${totalCorrect} <span style="font-size: 1.1rem; color: var(--text-muted);">câu</span></div>
            <div style="font-size: 0.85rem; color: var(--danger); font-weight: 600;">Số câu sai: ${totalAnswered - totalCorrect} câu</div>
          </div>
        </div>

        <h3 style="margin: 24px 0 12px 0;">Chi tiết bảng điểm từng chương:</h3>
        <div class="table-responsive">
          <table class="chapter-breakdown-table">
            <thead>
              <tr>
                <th>Tên Chương Học</th>
                <th>Đã làm</th>
                <th>Số câu đúng</th>
                <th>Điểm số</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>

        <div style="text-align: center; margin-top: 32px;">
          <button class="btn-primary" onclick="resetAllData()">
            🗑️ Xóa kết quả làm lại từ đầu tất cả các chương
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function resetAllData() {
      if (confirm("Bạn có chắc chắn muốn đặt lại toàn bộ kết quả trắc nghiệm của cả 8 chương không?")) {
        initQuizSessions();
        renderMainContent();
      }
    }

    // --- 5. CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI (THEME) ---
    function toggleTheme() {
      appState.theme = appState.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', appState.theme);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (appState.theme === 'dark') {
        icon.textContent = '☀️';
        label.textContent = 'Chế độ sáng';
      } else {
        icon.textContent = '🌙';
        label.textContent = 'Chế độ tối';
      }
    }

    // --- KHỞI CHẠY ỨNG DỤNG ---
    window.addEventListener('DOMContentLoaded', () => {
      initQuizSessions();
      renderNavigation();
      renderMainContent();
    });
  </script>
</body>
</html>
